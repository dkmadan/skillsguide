<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="bg-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1936" />
      <stop offset="55%" stop-color="#0F2544" />
      <stop offset="100%" stop-color="#0C353C" />
    </linearGradient>
    <radialGradient id="glow-med" cx="80%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-med-gold" cx="15%" cy="85%" r="38%">
      <stop offset="0%" stop-color="#F2B33D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#F2B33D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-med" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#F2B33D" />
    </linearGradient>
    <pattern id="grid-med" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-med)" />
  <rect width="960" height="540" fill="url(#grid-med)" />
  <rect width="960" height="540" fill="url(#glow-med)" />
  <rect width="960" height="540" fill="url(#glow-med-gold)" />

  <!-- Header -->
  <g transform="translate(48, 42)">
    <rect width="234" height="30" rx="15" fill="#14B8A6" fill-opacity="0.22" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4" fill="#F2B33D" />
    <text x="32" y="19" fill="#CCFBF1" font-size="11.5" font-weight="700" letter-spacing="0.8" font-family="system-ui, -apple-system, sans-serif">HEALTHCARE CAREER SHIFT</text>
    <text x="0" y="68" fill="#FAF8F3" font-size="27" font-weight="800" font-family="Georgia, serif">Nursing &amp; Allied Health → Medical Coding</text>
    <text x="0" y="96" fill="#CBD5E1" font-size="14" font-weight="500" font-family="system-ui, -apple-system, sans-serif">ICD-10-CM &amp; CPT Guidelines • US Healthcare RCM • HCC Auditing • Claims Analytics</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(48, 178)">
    <rect width="246" height="236" rx="20" fill="#102849" fill-opacity="0.92" stroke="#2B527A" stroke-width="1.5" />
    <rect x="20" y="20" width="124" height="24" rx="8" fill="#155E75" />
    <text x="82" y="36" fill="#CFFAFE" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CLINICAL STRENGTH</text>
    <!-- Medical Cross Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#0F766E" fill-opacity="0.45" stroke="#5EEAD4" stroke-opacity="0.5" />
    <path d="M42 71 V93 M31 82 H53" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Clinical Graduates</text>
    <text x="20" y="158" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• B.Sc Nursing, GNM, BPT</text>
    <text x="20" y="182" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Anatomy &amp; Physiology Edge</text>
    <text x="20" y="206" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Clinical Chart Fluency</text>
  </g>

  <path d="M302 296 L350 296" stroke="url(#accent-med)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="348,289 360,296 348,303" fill="#2DD4BF" />

  <!-- Stage 2 -->
  <g transform="translate(364, 178)">
    <rect width="246" height="236" rx="20" fill="#0E343D" fill-opacity="0.95" stroke="#14B8A6" stroke-width="2" />
    <rect x="20" y="20" width="124" height="24" rx="8" fill="#0F766E" fill-opacity="0.7" />
    <text x="82" y="36" fill="#CCFBF1" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">12-WEEK BRIDGE</text>
    <!-- Structured Chart / Codebook Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#115E59" fill-opacity="0.6" stroke="#2DD4BF" stroke-opacity="0.6" />
    <rect x="31" y="70" width="22" height="24" rx="3" stroke="#99F6E4" stroke-width="2" />
    <path d="M36 77 H48 M36 82 H48 M36 87 H44" stroke="#F2B33D" stroke-width="2" stroke-linecap="round" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Coding &amp; RCM Stack</text>
    <text x="20" y="158" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• ICD-10-CM, CPT &amp; Modifiers</text>
    <text x="20" y="182" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• HIPAA &amp; CPC Readiness</text>
    <text x="20" y="206" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• Excel Claims Denial Audits</text>
  </g>

  <path d="M618 296 L666 296" stroke="url(#accent-med)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="664,289 676,296 664,303" fill="#F2B33D" />

  <!-- Stage 3 -->
  <g transform="translate(680, 178)">
    <rect width="232" height="236" rx="20" fill="#13294B" fill-opacity="0.96" stroke="#F2B33D" stroke-width="2" />
    <rect x="20" y="20" width="120" height="24" rx="8" fill="#F2B33D" />
    <text x="80" y="36" fill="#0F1E4A" font-size="10.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">CORPORATE ROLE</text>
    <!-- Analytics Bars Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#F2B33D" fill-opacity="0.18" stroke="#F2B33D" stroke-opacity="0.6" />
    <rect x="30" y="84" width="5" height="10" rx="1.5" fill="#5EEAD4" />
    <rect x="39" y="77" width="5" height="17" rx="1.5" fill="#F2B33D" />
    <rect x="48" y="71" width="5" height="23" rx="1.5" fill="#2DD4BF" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Medical Coder / RCM</text>
    <text x="20" y="160" fill="#FDE68A" font-size="15" font-weight="800" font-family="system-ui, sans-serif">₹3.2L → ₹16L+ LPA</text>
    <text x="20" y="186" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• 5-Day Corporate Healthcare</text>
    <text x="20" y="208" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Optum, Omega, GeBBS GCCs</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(48, 446)">
    <rect width="864" height="54" rx="14" fill="#091529" fill-opacity="0.9" stroke="#1E4B5A" stroke-width="1.2" />
    <text x="24" y="32" fill="#F2B33D" font-size="12" font-weight="800" font-family="system-ui, sans-serif">CAREER LADDER:</text>
    <text x="150" y="32" fill="#E2E8F0" font-size="12.5" font-weight="600" font-family="system-ui, sans-serif">Coding Trainee → Certified Coder (CPC) → HCC Risk Adjustment Auditor → Healthcare Data Analyst</text>
  </g>
</svg>
