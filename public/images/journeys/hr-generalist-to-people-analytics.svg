    <text x="20" y="182" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• SQL &amp; Power BI HR Suites</text>
    <text x="20" y="206" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• Workday / Darwinbox + AI</text>
