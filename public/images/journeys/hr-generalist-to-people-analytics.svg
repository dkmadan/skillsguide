<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="bg-hr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1938" />
      <stop offset="55%" stop-color="#0F234A" />
      <stop offset="100%" stop-color="#0B332A" />
    </linearGradient>
    <radialGradient id="glow-hr" cx="78%" cy="26%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
