    <path d="M42 72 V82 L49 87" stroke="#F2B33D" stroke-width="2.2" stroke-linecap="round" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">People Analytics</text>
    <text x="20" y="160" fill="#FDE68A" font-size="15" font-weight="800" font-family="system-ui, sans-serif">₹6.5L – ₹15.0L LPA</text>
