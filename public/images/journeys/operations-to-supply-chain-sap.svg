<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="bg-scm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D183B" />
      <stop offset="55%" stop-color="#132252" />
      <stop offset="100%" stop-color="#292116" />
    </linearGradient>
    <radialGradient id="glow-scm" cx="78%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#F2B33D" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#F2B33D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-scm-blue" cx="18%" cy="84%" r="42%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-scm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F2B33D" />
    </linearGradient>
    <pattern id="grid-scm" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" fill-opacity="0.14" />
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-scm)" />
  <rect width="960" height="540" fill="url(#grid-scm)" />
  <rect width="960" height="540" fill="url(#glow-scm)" />
  <rect width="960" height="540" fill="url(#glow-scm-blue)" />

  <!-- Header -->
  <g transform="translate(48, 42)">
    <rect width="232" height="30" rx="15" fill="#F2B33D" fill-opacity="0.22" stroke="#F2B33D" stroke-opacity="0.65" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4" fill="#F2B33D" />
    <text x="32" y="19" fill="#FEF3C7" font-size="11.5" font-weight="700" letter-spacing="0.8" font-family="system-ui, -apple-system, sans-serif">ENTERPRISE SUPPLY CHAIN</text>
    <text x="0" y="68" fill="#FAF8F3" font-size="27" font-weight="800" font-family="Georgia, serif">Operations &amp; Logistics → SAP &amp; Supply Chain</text>
    <text x="0" y="96" fill="#CBD5E1" font-size="14" font-weight="500" font-family="system-ui, -apple-system, sans-serif">SAP S/4HANA P2P &amp; O2C • Inventory ABC-XYZ Modeling • Supplier OTIF Control Tower</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(48, 178)">
    <rect width="246" height="236" rx="20" fill="#132556" fill-opacity="0.92" stroke="#365594" stroke-width="1.5" />
    <rect x="20" y="20" width="128" height="24" rx="8" fill="#1E3A8A" />
    <text x="84" y="36" fill="#BFDBFE" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">FLOOR EXPERTISE</text>
    <!-- Box / Warehouse Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#1E3A8A" fill-opacity="0.6" stroke="#60A5FA" stroke-opacity="0.5" />
    <path d="M42 70 L53 76 V88 L42 94 L31 88 V76 L42 70 Z" stroke="#93C5FD" stroke-width="2" />
    <path d="M31 76 L42 82 L53 76 M42 82 V94" stroke="#F2B33D" stroke-width="1.8" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Ops &amp; Warehouse</text>
    <text x="20" y="158" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Dispatch, GRN &amp; Vendors</text>
    <text x="20" y="182" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Real Stockout Intuition</text>
    <text x="20" y="206" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• 3PL &amp; Plant Scheduling</text>
  </g>

  <path d="M302 296 L350 296" stroke="url(#accent-scm)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="348,289 360,296 348,303" fill="#FBBF24" />

  <!-- Stage 2 -->
  <g transform="translate(364, 178)">
    <rect width="246" height="236" rx="20" fill="#2A2318" fill-opacity="0.94" stroke="#F59E0B" stroke-width="2" />
    <rect x="20" y="20" width="136" height="24" rx="8" fill="#B45309" fill-opacity="0.65" />
    <text x="88" y="36" fill="#FEF3C7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">14-WEEK ERP + BI</text>
    <!-- Workflow Nodes Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#78350F" fill-opacity="0.6" stroke="#FBBF24" stroke-opacity="0.65" />
    <rect x="29" y="72" width="10" height="8" rx="2" fill="#FDE68A" />
    <rect x="45" y="72" width="10" height="8" rx="2" fill="#F2B33D" />
    <rect x="37" y="86" width="10" height="8" rx="2" fill="#93C5FD" />
    <path d="M39 76 H45 M34 80 L40 86 M50 80 L44 86" stroke="#FEF3C7" stroke-width="1.6" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">SAP S/4HANA &amp; KPIs</text>
    <text x="20" y="158" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• P2P (PR→PO→MIGO→MIRO)</text>
    <text x="20" y="182" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• EOQ, Safety Stock &amp; OTIF</text>
    <text x="20" y="206" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• SQL &amp; Power BI Control Tower</text>
  </g>

  <path d="M618 296 L666 296" stroke="url(#accent-scm)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="664,289 676,296 664,303" fill="#F2B33D" />

  <!-- Stage 3 -->
  <g transform="translate(680, 178)">
    <rect width="232" height="236" rx="20" fill="#142552" fill-opacity="0.96" stroke="#F2B33D" stroke-width="2" />
    <rect x="20" y="20" width="126" height="24" rx="8" fill="#F2B33D" />
    <text x="83" y="36" fill="#0F1E4A" font-size="10.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">ENTERPRISE ROLE</text>
    <!-- Globe Route Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#F2B33D" fill-opacity="0.18" stroke="#F2B33D" stroke-opacity="0.6" />
    <circle cx="42" cy="82" r="11" stroke="#FDE68A" stroke-width="1.8" />
    <path d="M31 82 H53 M42 71 C46 75 46 89 42 93 C38 89 38 75 42 71 Z" stroke="#F2B33D" stroke-width="1.5" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Supply Chain / SAP</text>
    <text x="20" y="160" fill="#FDE68A" font-size="15" font-weight="800" font-family="system-ui, sans-serif">₹6.0L – ₹13.5L LPA</text>
    <text x="20" y="186" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• FMCG, E-Com &amp; MNC GCCs</text>
    <text x="20" y="208" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Junior SAP MM / Planning</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(48, 446)">
    <rect width="864" height="54" rx="14" fill="#0B142E" fill-opacity="0.92" stroke="#5A4520" stroke-width="1.2" />
    <text x="24" y="32" fill="#F2B33D" font-size="12" font-weight="800" font-family="system-ui, sans-serif">CAPSTONE ASSETS:</text>
    <text x="166" y="32" fill="#E2E8F0" font-size="12.5" font-weight="600" font-family="system-ui, sans-serif">ABC-XYZ Reorder Workbook  •  SAP P2P Blueprint  •  Multi-Warehouse Power BI Control Tower</text>
  </g>
