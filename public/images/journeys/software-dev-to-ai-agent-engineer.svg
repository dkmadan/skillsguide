<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1538" />
      <stop offset="55%" stop-color="#0F1E4A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="glow-ai" cx="78%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-gold" cx="18%" cy="82%" r="40%">
      <stop offset="0%" stop-color="#F2B33D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#F2B33D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F2B33D" />
    </linearGradient>
    <pattern id="grid-ai" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.16" />
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg-ai)" />
  <rect width="960" height="540" fill="url(#grid-ai)" />
  <rect width="960" height="540" fill="url(#glow-ai)" />
  <rect width="960" height="540" fill="url(#glow-gold)" />

  <!-- Top Editorial Header -->
  <g transform="translate(48, 42)">
    <rect width="218" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.22" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4" fill="#F2B33D" />
    <text x="32" y="19" fill="#EDE9FE" font-size="11.5" font-weight="700" letter-spacing="0.8" font-family="system-ui, -apple-system, sans-serif">AI ENGINEERING PIVOT</text>
    <text x="0" y="68" fill="#FAF8F3" font-size="28" font-weight="800" font-family="Georgia, serif">Software Dev → AI Agent Engineer</text>
    <text x="0" y="96" fill="#CBD5E1" font-size="14" font-weight="500" font-family="system-ui, -apple-system, sans-serif">Production RAG • MCP Tool Calling • Multi-Agent Systems • Automated Evals</text>
  </g>

  <!-- Transition Flow Cards -->
  <!-- Stage 1: Starting Point -->
  <g transform="translate(48, 178)">
    <rect width="246" height="236" rx="20" fill="#132252" fill-opacity="0.92" stroke="#334E8B" stroke-width="1.5" />
    <rect x="20" y="20" width="116" height="24" rx="8" fill="#1E3A8A" />
    <text x="78" y="36" fill="#BFDBFE" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CURRENT BASE</text>
    <!-- Code Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#1E3A8A" fill-opacity="0.6" stroke="#60A5FA" stroke-opacity="0.5" />
    <path d="M35 76 L29 82 L35 88 M49 76 L55 82 L49 88 M44 73 L40 91" stroke="#93C5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Full-Stack / Backend</text>
    <text x="20" y="158" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• REST APIs &amp; SQL Databases</text>
    <text x="20" y="182" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• TypeScript / Python Basics</text>
    <text x="20" y="206" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• Cloud Deployment Hygiene</text>
  </g>

  <!-- Connector 1 -->
  <path d="M302 296 L350 296" stroke="url(#accent-ai)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="348,289 360,296 348,303" fill="#A78BFA" />

  <!-- Stage 2: Bridge Stack -->
  <g transform="translate(364, 178)">
    <rect width="246" height="236" rx="20" fill="#1F1A52" fill-opacity="0.96" stroke="#8B5CF6" stroke-width="2" />
    <rect x="20" y="20" width="124" height="24" rx="8" fill="#6D28D9" fill-opacity="0.55" />
    <text x="82" y="36" fill="#EDE9FE" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">12-WEEK BRIDGE</text>
    <!-- Neural Agent Nodes Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#5B21B6" fill-opacity="0.5" stroke="#C4B5FD" stroke-opacity="0.6" />
    <circle cx="33" cy="75" r="3.5" fill="#F2B33D" />
    <circle cx="51" cy="75" r="3.5" fill="#C4B5FD" />
    <circle cx="42" cy="91" r="4" fill="#A78BFA" />
    <path d="M36 76 L48 76 M34 78 L40 88 M50 78 L44 88" stroke="#DDD6FE" stroke-width="1.6" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Agentic AI Stack</text>
    <text x="20" y="158" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• Hybrid RAG &amp; pgvector</text>
    <text x="20" y="182" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• MCP Servers &amp; Tool Calling</text>
    <text x="20" y="206" fill="#E2E8F0" font-size="12.5" font-family="system-ui, sans-serif">• Automated Evals &amp; Tracing</text>
  </g>

  <!-- Connector 2 -->
  <path d="M618 296 L666 296" stroke="url(#accent-ai)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="664,289 676,296 664,303" fill="#F2B33D" />

  <!-- Stage 3: Outcome -->
  <g transform="translate(680, 178)">
    <rect width="232" height="236" rx="20" fill="#17244F" fill-opacity="0.96" stroke="#F2B33D" stroke-width="2" />
    <rect x="20" y="20" width="120" height="24" rx="8" fill="#F2B33D" />
    <text x="80" y="36" fill="#0F1E4A" font-size="10.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">TARGET OUTCOME</text>
    <!-- Spark / Trophy Icon -->
    <rect x="20" y="60" width="44" height="44" rx="12" fill="#F2B33D" fill-opacity="0.18" stroke="#F2B33D" stroke-opacity="0.6" />
    <path d="M42 69 L45 79 L55 82 L45 85 L42 95 L39 85 L29 82 L39 79 Z" fill="#F2B33D" />
    <text x="20" y="132" fill="#FFFFFF" font-size="17" font-weight="800" font-family="system-ui, sans-serif">Applied AI Engineer</text>
    <text x="20" y="160" fill="#FDE68A" font-size="15" font-weight="800" font-family="system-ui, sans-serif">₹12L – ₹32L+ LPA</text>
    <text x="20" y="186" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• AI Startups &amp; Global GCCs</text>
    <text x="20" y="208" fill="#CBD5E1" font-size="12.5" font-family="system-ui, sans-serif">• 2–4 Month Transition</text>
  </g>

  <!-- Bottom Metrics Bar -->
  <g transform="translate(48, 446)">
    <rect width="864" height="54" rx="14" fill="#0A122E" fill-opacity="0.9" stroke="#263B74" stroke-width="1.2" />
    <text x="24" y="32" fill="#F2B33D" font-size="12" font-weight="800" font-family="system-ui, sans-serif">KEY DELIVERABLES:</text>
    <text x="166" y="32" fill="#E2E8F0" font-size="12.5" font-weight="600" font-family="system-ui, sans-serif">Hybrid RAG API  •  MCP Multi-Step Agent  •  60-Case CI Eval Suite  •  Cost &amp; Latency Benchmarks</text>
  </g>
</svg>
