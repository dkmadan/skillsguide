<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#iotBg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#ea580c" fill-opacity="0.18" stroke="#f97316" stroke-width="1" />
    <text x="90" y="17" fill="#fdba74" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">EMBEDDED HARDWARE &amp; AI</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">Bare-Metal Rust, ESP32 Edge AI &amp; Automotive CAN Bus</text>
  </g>

  <!-- 4-Stage Horizontal Flow -->
  <!-- Stage 1: Ingestion & Sensors -->
  <g transform="translate(40, 135)">
    <rect width="190" height="330" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />
    <rect x="15" y="15" width="160" height="28" rx="8" fill="#334155" />
    <text x="95" y="34" fill="#f8fafc" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1. PHYSICAL SENSORS</text>

    <g transform="translate(15, 60)">
      <rect width="160" height="55" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">IMU &amp; Accelerometer</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Vibration &amp; Tilt Telemetry</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="160" height="55" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Thermal &amp; Pressure</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">I2C / SPI Protocol Bus</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="160" height="55" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">ADC Audio / Acoustic</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Factory Machinery Hum</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="160" height="60" rx="8" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="24" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Sampling Rate</text>
      <text x="12" y="42" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">DMA Direct Memory Access</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 235 300 L 265 300" stroke="#ea580c" stroke-width="2" />
  <polygon points="265,296 273,300 265,304" fill="#ea580c" />

  <!-- Stage 2: Rust Embedded Firmware -->
  <g transform="translate(270, 135)">
    <rect width="200" height="330" rx="16" fill="#431407" fill-opacity="0.3" stroke="#ea580c" stroke-width="2" />
    <rect x="15" y="15" width="170" height="28" rx="8" fill="url(#rustGrad)" />
    <text x="100" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2. RUST BARE-METAL</text>

    <g transform="translate(15, 60)">
      <rect width="170" height="55" rx="8" fill="#1c0c08" stroke="#7c2d12" />
      <text x="12" y="22" fill="#fed7aa" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">#![no_std] Core</text>
      <text x="12" y="38" fill="#fdba74" font-size="9" font-family="system-ui, sans-serif">Zero-Overhead Memory Safety</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="170" height="55" rx="8" fill="#1c0c08" stroke="#7c2d12" />
      <text x="12" y="22" fill="#fed7aa" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">ESP32-S3 / C6 MCU</text>
      <text x="12" y="38" fill="#fdba74" font-size="9" font-family="system-ui, sans-serif">FreeRTOS Context Schedulers</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="170" height="55" rx="8" fill="#1c0c08" stroke="#7c2d12" />
      <text x="12" y="22" fill="#fed7aa" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Embedded HAL</text>
      <text x="12" y="38" fill="#fdba74" font-size="9" font-family="system-ui, sans-serif">GPIO, PWM, UART Drivers</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="170" height="60" rx="8" fill="#2d1309" stroke="#ea580c" stroke-dasharray="2 2" />
      <text x="85" y="24" fill="#ffedd5" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Memory Guarantee</text>
      <text x="85" y="44" fill="#fdba74" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Eliminates Buffer Overflows</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 475 300 L 505 300" stroke="#06b6d4" stroke-width="2" />
  <polygon points="505,296 513,300 505,304" fill="#06b6d4" />

  <!-- Stage 3: Edge AI Inference -->
  <g transform="translate(510, 135)">
    <rect width="200" height="330" rx="16" fill="#083344" fill-opacity="0.3" stroke="#06b6d4" stroke-width="2" />
    <rect x="15" y="15" width="170" height="28" rx="8" fill="url(#edgeGrad)" />
    <text x="100" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3. EDGE AI / TINYML</text>

    <g transform="translate(15, 60)">
      <rect width="170" height="55" rx="8" fill="#082f49" stroke="#0284c7" />
      <text x="12" y="22" fill="#bae6fd" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">INT8 Quantization</text>
      <text x="12" y="38" fill="#7dd3fc" font-size="9" font-family="system-ui, sans-serif">TFLite Micro / Edge Impulse</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="170" height="55" rx="8" fill="#082f49" stroke="#0284c7" />
      <text x="12" y="22" fill="#bae6fd" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">On-Device Anomaly</text>
      <text x="12" y="38" fill="#7dd3fc" font-size="9" font-family="system-ui, sans-serif">Sub-10ms Inference Latency</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="170" height="55" rx="8" fill="#082f49" stroke="#0284c7" />
      <text x="12" y="22" fill="#bae6fd" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Zero Cloud Dependency</text>
      <text x="12" y="38" fill="#7dd3fc" font-size="9" font-family="system-ui, sans-serif">Operates in Offline Tunnels</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="170" height="60" rx="8" fill="#0c4a6e" stroke="#06b6d4" stroke-dasharray="2 2" />
      <text x="85" y="24" fill="#e0f2fe" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Power Efficiency</text>
      <text x="85" y="44" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">&lt; 150mW Operating Draw</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 715 300 L 745 300" stroke="#10b981" stroke-width="2" />
  <polygon points="745,296 753,300 745,304" fill="#10b981" />

  <!-- Stage 4: Automotive & Industrial Bus -->
  <g transform="translate(750, 135)">
    <rect width="170" height="330" rx="16" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="140" height="28" rx="8" fill="#059669" />
    <text x="85" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4. AUTOMOTIVE</text>

    <g transform="translate(15, 60)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#047857" />
      <text x="10" y="22" fill="#a7f3d0" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">CAN Bus 2.0B / FD</text>
      <text x="10" y="38" fill="#6ee7b7" font-size="9" font-family="system-ui, sans-serif">500 kbps ECU Comms</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#047857" />
      <text x="10" y="22" fill="#a7f3d0" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">ISO 26262 ASIL</text>
      <text x="10" y="38" fill="#6ee7b7" font-size="9" font-family="system-ui, sans-serif">Functional Safety</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="140" height="55" rx="8" fill="#0f172a" stroke="#047857" />
      <text x="10" y="22" fill="#a7f3d0" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">MQTT / Cellular</text>
      <text x="10" y="38" fill="#6ee7b7" font-size="9" font-family="system-ui, sans-serif">AWS IoT Core Hub</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="140" height="60" rx="8" fill="#022c22" stroke="#059669" stroke-dasharray="2 2" />
      <text x="70" y="24" fill="#d1fae5" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">OTA Update</text>
      <text x="70" y="44" fill="#a7f3d0" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Cryptographic Signing</text>
    </g>
  </g>
</svg>
