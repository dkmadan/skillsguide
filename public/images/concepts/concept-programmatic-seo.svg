      <text x="190" y="26" fill="#bfdbfe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Massive Zero-CAC Organic Impressions</text>
      <text x="190" y="46" fill="#93c5fd" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Dominating long-tail search results across India &amp; Global markets</text>
