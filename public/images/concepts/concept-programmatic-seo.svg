    <g transform="translate(20, 60)">
      <rect width="380" height="50" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1. Database-Driven Page Generation</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Relational dataset mapping 1,000s of localized &amp; intent keywords</text>
