      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="googleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4" />
      <stop offset="100%" stop-color="#34a853" />
