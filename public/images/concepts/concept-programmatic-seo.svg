    <!-- Stage 2 -->
    <g transform="translate(20, 125)">
      <rect width="380" height="50" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">2. Technical Crawl Budget &amp; Core Web Vitals</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Sub-second LCP, 0ms CLS, automated XML sitemap clustering &amp; schema</text>
