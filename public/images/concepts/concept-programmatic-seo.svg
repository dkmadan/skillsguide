      <text x="15" y="22" fill="#d8b4fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">3. High-Converting Landing Page Optimization</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Frictionless checkout, social proof triggers, and urgency CTAs</text>
