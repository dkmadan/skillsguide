      <text x="15" y="22" fill="#d8b4fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">1. Meta &amp; Google Ads Advantage+ Campaigns</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Broad audience targeting, UGC video hooks &amp; Dynamic Creative Testing</text>
