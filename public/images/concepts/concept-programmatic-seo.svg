    <!-- Stage 3 -->
    <g transform="translate(20, 190)">
      <rect width="380" height="50" rx="10" fill="#1e293b" stroke="#334155" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">3. Internal Link Equity Distribution</text>
