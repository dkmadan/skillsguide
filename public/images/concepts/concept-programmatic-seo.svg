  <rect width="960" height="540" rx="20" fill="url(#seoBg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="185" height="26" rx="13" fill="#3b82f6" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1" />
    <text x="92" y="17" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">GROWTH ACQUISITION ENGINE</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">Programmatic SEO, Paid Ad Arbitrage &amp; Technical Auditing</text>
  </g>

  <!-- Left: Programmatic SEO Engine -->
  <g transform="translate(40, 130)">
    <rect width="420" height="340" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5" />
