    <rect x="20" y="15" width="200" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. TPA CLAIMS SETTLEMENT</text>
