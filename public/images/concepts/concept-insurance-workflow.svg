    <rect x="20" y="15" width="210" height="24" rx="6" fill="#4338ca" fill-opacity="0.4" />
    <text x="125" y="32" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. POLICY ADMIN (PAS)</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Guidewire &amp; Duck Creek</text>
    <text x="125" y="95" fill="#c7d2fe" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Endorsements, Renewals &amp; Portability</text>
    <path d="M 30 120 L 220 120" stroke="#3730a3" stroke-width="1" />
