      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
    <text x="100" y="17" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">BFSI OPERATIONS 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">Insurance Underwriting &amp; Claims Adjudication</text>
  </g>

  <!-- Step 1: Proposal & Actuarial Rating -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#1d4ed8" fill-opacity="0.3" />
    <text x="120" y="32" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. UNDERWRITING &amp; RISK</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Policy Risk Assessment</text>
    <text x="120" y="95" fill="#93c5fd" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Medical MER • Financial Underwriting</text>
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Mortality &amp; Morbidity Tables</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Pre-Existing Condition Loading</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• IRDAI Product Guidelines</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 250 L 340 250" stroke="#6366f1" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#6366f1" />

