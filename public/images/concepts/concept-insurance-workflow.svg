  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">INSURANCE &amp; TPA TECHNOLOGY STACK</text>
