<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="90" x2="960" y2="90" />
    <line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="270" x2="960" y2="270" />
    <line x1="0" y1="360" x2="960" y2="360" />
    <line x1="0" y1="450" x2="960" y2="450" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" />
    <line x1="800" y1="0" x2="800" y2="540" />
  </g>

  <!-- Header Section -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1" />
    <text x="85" y="17" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">AI ENGINEERING 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">Agentic AI &amp; Model Context Protocol (MCP) Architecture</text>
  </g>

  <!-- Step 1: User / System Input -->
  <g transform="translate(40, 150)">
    <rect width="180" height="130" rx="16" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1.5" />
    <circle cx="90" cy="38" r="20" fill="url(#cyanGrad)" />
    <text x="90" y="44" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">1</text>
    <text x="90" y="80" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Task Prompt &amp; Goal</text>
    <text x="90" y="100" fill="#94a3b8" font-size="10.5" text-anchor="middle" font-family="system-ui, sans-serif">Complex Intent &amp; SLA</text>
    <text x="90" y="116" fill="#06b6d4" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Prompt Optimization</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 215 L 265 215" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="265,210 275,215 265,220" fill="#8b5cf6" />

  <!-- Step 2: Agent Orchestration Engine -->
  <g transform="translate(280, 125)">
    <rect width="250" height="180" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <rect x="15" y="14" width="220" height="26" rx="8" fill="#4338ca" fill-opacity="0.4" />
    <text x="125" y="32" fill="#e0e7ff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">AUTONOMOUS ORCHESTRATOR</text>
    <text x="125" y="72" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">LangChain &amp; LlamaIndex</text>
    <text x="125" y="92" fill="#c7d2fe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Self-Reflection &amp; Planning</text>
    <text x="125" y="110" fill="#c7d2fe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Multi-Turn State Management</text>
    <text x="125" y="128" fill="#c7d2fe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dynamic Tool Dispatch</text>
    <rect x="25" y="142" width="200" height="24" rx="6" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" />
    <text x="125" y="158" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">ReAct / Plan-and-Solve Loop</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 530 215 L 575 215" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="575,210 585,215 575,220" fill="#10b981" />

  <!-- Step 3: MCP Architecture Core -->
  <g transform="translate(590, 115)">
    <rect width="330" height="200" rx="18" fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />
    <rect x="15" y="14" width="300" height="26" rx="8" fill="#047857" fill-opacity="0.5" />
    <text x="165" y="32" fill="#a7f3d0" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">MODEL CONTEXT PROTOCOL (MCP)</text>
    
    <!-- Client & Server Subsections -->
    <rect x="20" y="52" width="135" height="135" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1" />
    <text x="87" y="74" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">MCP Client</text>
    <text x="87" y="94" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Standard Protocol</text>
    <text x="87" y="112" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Tool Discovery</text>
    <text x="87" y="130" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Context Streaming</text>
    <text x="87" y="152" fill="#6ee7b7" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">JSON-RPC 2.0</text>

    <rect x="175" y="52" width="135" height="135" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1" />
    <text x="242" y="74" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">MCP Servers</text>
    <text x="242" y="94" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Postgres / SQLite</text>
    <text x="242" y="112" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Local Filesystem</text>
    <text x="242" y="130" fill="#cbd5e1" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">REST &amp; Webhook APIs</text>
    <text x="242" y="152" fill="#6ee7b7" font-size="9" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Docker Containers</text>
  </g>

  <!-- Bottom Row: LLM Reasoning & SLM Fine-Tuning + Output -->
  <!-- Box 4: LLMs & SLM Fine-Tuning -->
  <g transform="translate(140, 360)">
    <rect width="360" height="135" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.5" />
    <text x="180" y="28" fill="#fbbf24" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">FOUNDATION MODELS &amp; FINE-TUNED SLMs</text>
    <text x="180" y="55" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">LoRA &amp; QLoRA Parameter-Efficient Tuning</text>
    <text x="180" y="78" fill="#cbd5e1" font-size="10.5" text-anchor="middle" font-family="system-ui, sans-serif">Llama-3, Mistral, Phi-3, Gemma-2 for edge &amp; domain speed</text>
    
    <rect x="25" y="92" width="145" height="28" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
    <text x="97" y="110" fill="#fcd34d" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">vLLM Inference Engine</text>

    <rect x="190" y="92" width="145" height="28" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="1" />
    <text x="262" y="110" fill="#fcd34d" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">GGUF / AWQ Quantization</text>
  </g>

  <!-- Connecting Line from Orchestrator down to Models -->
  <path d="M 405 305 L 405 360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
  
  <!-- Connecting Line from MCP down to Output -->
  <path d="M 755 315 L 755 360" stroke="#06b6d4" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Box 5: Synthesized Output & Action Execution -->
  <g transform="translate(560, 360)">
    <rect width="360" height="135" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
    <text x="180" y="28" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">VALIDATED AGENTIC OUTPUT</text>
    <text x="180" y="55" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Grounded Execution &amp; Continuous Telemetry</text>
    <text x="180" y="78" fill="#94a3b8" font-size="10.5" text-anchor="middle" font-family="system-ui, sans-serif">Zero-hallucination structured responses, live code generation,</text>
    <text x="180" y="94" fill="#94a3b8" font-size="10.5" text-anchor="middle" font-family="system-ui, sans-serif">and automated enterprise workflow transactions</text>

    <rect x="35" y="104" width="290" height="20" rx="5" fill="#0284c7" fill-opacity="0.2" />
    <text x="180" y="118" fill="#7dd3fc" font-size="9.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Human-in-the-Loop Safeguards &amp; Guardrails</text>
  </g>

</svg>
