<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#844fba" />
      <stop offset="100%" stop-color="#5c4ee5" />
    </linearGradient>
    <linearGradient id="k8sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="sreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#cloudBg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#3b82f6" fill-opacity="0.18" stroke="#60a5fa" stroke-width="1" />
    <text x="90" y="17" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PLATFORM INFRASTRUCTURE</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">Multi-Cloud IaC, Kubernetes Operator &amp; SRE Observability</text>
  </g>

  <!-- Col 1: Declarative IaC -->
  <g transform="translate(40, 130)">
    <rect width="200" height="340" rx="16" fill="#1e1b4b" fill-opacity="0.5" stroke="#7c3aed" stroke-width="1.5" />
    <rect x="15" y="15" width="170" height="28" rx="8" fill="url(#terraGrad)" />
    <text x="100" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1. TERRAFORM (IaC)</text>
    
    <g transform="translate(15, 60)">
      <rect width="170" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="15" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">HCL Modules &amp; State</text>
      <text x="15" y="38" fill="#94a3b8" font-size="9.5" font-family="system-ui, sans-serif">Remote S3 / GCS Locks</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="170" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="15" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Multi-Cloud VPC</text>
      <text x="15" y="38" fill="#94a3b8" font-size="9.5" font-family="system-ui, sans-serif">AWS &amp; GCP Peering</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="170" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="15" y="22" fill="#cbd5e1" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">IAM &amp; Secret Vaults</text>
      <text x="15" y="38" fill="#94a3b8" font-size="9.5" font-family="system-ui, sans-serif">HashiCorp Vault / KMS</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="170" height="65" rx="10" fill="#2e1065" stroke="#9333ea" stroke-dasharray="3 3" />
      <text x="85" y="25" fill="#e9d5ff" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">GitOps Push</text>
      <text x="85" y="45" fill="#d8b4fe" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">ArgoCD &amp; GitHub Actions</text>
    </g>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <path d="M 245 300 L 275 300" stroke="#818cf8" stroke-width="2" />
  <polygon points="275,296 283,300 275,304" fill="#818cf8" />

  <!-- Col 2: Kubernetes Operator SDK -->
  <g transform="translate(285, 130)">
    <rect width="360" height="340" rx="16" fill="#0c4a6e" fill-opacity="0.35" stroke="#0284c7" stroke-width="2" />
    <rect x="20" y="15" width="320" height="28" rx="8" fill="url(#k8sGrad)" />
    <text x="180" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2. KUBERNETES OPERATOR RECONCILIATION LOOP</text>

    <!-- Reconciliation Cycle Circle -->
    <g transform="translate(30, 60)">
      <rect width="300" height="135" rx="12" fill="#0f172a" stroke="#0369a1" />
      <text x="150" y="25" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Custom Resource Definition (CRD)</text>
      
      <g transform="translate(15, 40)">
        <rect width="80" height="75" rx="8" fill="#1e293b" />
        <text x="40" y="30" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">OBSERVE</text>
        <text x="40" y="50" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">Cluster State</text>
      </g>
      <text x="105" y="80" fill="#0284c7" font-size="16" font-weight="900">→</text>
      
      <g transform="translate(110, 40)">
        <rect width="80" height="75" rx="8" fill="#1e293b" />
        <text x="40" y="30" fill="#e2e8f0" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">DIFF</text>
        <text x="40" y="50" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">Desired vs Real</text>
      </g>
      <text x="200" y="80" fill="#0284c7" font-size="16" font-weight="900">→</text>

      <g transform="translate(205, 40)">
        <rect width="80" height="75" rx="8" fill="#1e293b" />
        <text x="40" y="30" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">ACT</text>
        <text x="40" y="50" fill="#94a3b8" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">Self-Healing</text>
      </g>
    </g>

    <!-- Sub-cluster Pod Mesh -->
    <g transform="translate(30, 210)">
      <rect width="300" height="110" rx="12" fill="#0f172a" stroke="#0369a1" />
      <text x="15" y="24" fill="#7dd3fc" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Multi-Tenant Workload Runtime</text>
      <g transform="translate(15, 35)">
        <rect width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="2 2" />
        <text x="40" y="25" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">EKS / GKE</text>
        <text x="40" y="42" fill="#38bdf8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Spot Nodes</text>
      </g>
      <g transform="translate(105, 35)">
        <rect width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="2 2" />
        <text x="40" y="25" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Service Mesh</text>
        <text x="40" y="42" fill="#38bdf8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Istio mTLS</text>
      </g>
      <g transform="translate(195, 35)">
        <rect width="90" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="2 2" />
        <text x="45" y="25" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Ingress NGINX</text>
        <text x="45" y="42" fill="#38bdf8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Cloudflare CDN</text>
      </g>
    </g>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <path d="M 650 300 L 680 300" stroke="#34d399" stroke-width="2" />
  <polygon points="680,296 688,300 680,304" fill="#34d399" />

  <!-- Col 3: SRE Telemetry & Observability -->
  <g transform="translate(690, 130)">
    <rect width="230" height="340" rx="16" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1.5" />
    <rect x="15" y="15" width="200" height="28" rx="8" fill="url(#sreGrad)" />
    <text x="115" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3. SRE OBSERVABILITY</text>

    <g transform="translate(15, 60)">
      <rect width="200" height="55" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="15" y="22" fill="#6ee7b7" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">SLIs &amp; SLO Error Budgets</text>
      <text x="15" y="40" fill="#a7f3d0" font-size="9.5" font-family="system-ui, sans-serif">99.99% Availability Targets</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="200" height="55" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="15" y="22" fill="#6ee7b7" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Prometheus &amp; Grafana</text>
      <text x="15" y="40" fill="#a7f3d0" font-size="9.5" font-family="system-ui, sans-serif">OpenTelemetry Metrics &amp; Traces</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="200" height="55" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="15" y="22" fill="#6ee7b7" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Chaos Engineering</text>
      <text x="15" y="40" fill="#a7f3d0" font-size="9.5" font-family="system-ui, sans-serif">Litmus / ChaosMesh drills</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="200" height="65" rx="10" fill="#022c22" stroke="#059669" stroke-dasharray="3 3" />
      <text x="100" y="26" fill="#a7f3d0" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Automated Runbooks</text>
      <text x="100" y="46" fill="#6ee7b7" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">PagerDuty &amp; Slack Ops Auto-Triage</text>
    </g>
  </g>
</svg>
