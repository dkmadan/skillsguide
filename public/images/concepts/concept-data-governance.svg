<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
    <text x="90" y="17" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">ENTERPRISE DATA 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">Enterprise Data Governance &amp; Lineage Framework</text>
  </g>

  <!-- Step 1: Ingestion & Metadata Discovery -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" />
    <text x="120" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. METADATA CATALOG</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Automated Crawling</text>
    <text x="120" y="95" fill="#a5b4fc" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Collibra • Apache Atlas • Alation</text>
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Auto-Discovered Schemas</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Enterprise Business Glossary</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Column-Level Classification</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 250 L 340 250" stroke="#6366f1" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#6366f1" />

  <!-- Step 2: Lineage & Quality Rules -->
  <g transform="translate(360, 140)">
    <rect width="250" height="220" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="2" />
    <rect x="20" y="15" width="210" height="24" rx="6" fill="#4338ca" fill-opacity="0.4" />
    <text x="125" y="32" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. LINEAGE &amp; INTEGRITY</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Great Expectations &amp; OpenLineage</text>
    <text x="125" y="95" fill="#c7d2fe" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Source-to-Dashboard Tracking</text>
    <path d="M 30 120 L 220 120" stroke="#3730a3" stroke-width="1" />
    <text x="125" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• End-to-End DAG Lineage</text>
    <text x="125" y="165" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Automated Data Quality Checks</text>
    <text x="125" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Anomaly Alerts on Drift</text>
  </g>

  <!-- Arrow -->
  <path d="M 615 250 L 670 250" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="670,245 680,250 670,255" fill="#10b981" />

  <!-- Step 3: Privacy, DPDP & Access -->
  <g transform="translate(680, 140)">
    <rect width="240" height="220" rx="16" fill="#06281e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. COMPLIANCE &amp; SECURITY</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">DPDP Act &amp; Immuta</text>
    <text x="120" y="95" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Attribute-Based Access Control</text>
    <path d="M 30 120 L 210 120" stroke="#065f46" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dynamic PII Tokenization</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• India DPDP 2023 Consent Audit</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Zero-Trust Query Logs</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">COMPLIANCE &amp; TOOL ECOSYSTEM</text>
    <text x="440" y="60" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Collibra • Apache Atlas • Great Expectations • Immuta • Snowflake Governance • India DPDP 2023 • GDPR</text>
  </g>
</svg>
