<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="accBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#accBg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="110" y="17" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">ACCOUNTING &amp; FP&amp;A ARCHITECTURE</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">General Ledger, Ind AS / IFRS, GST, TDS &amp; Financial Auditing</text>
  </g>

  <!-- Step 1: Transaction Processing & General Ledger -->
  <g transform="translate(40, 140)">
    <rect width="260" height="230" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5" />
    <rect x="20" y="15" width="220" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="130" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. RECORDING &amp; LEDGER</text>
    <text x="130" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Books &amp; Reconciliation</text>
    <text x="130" y="95" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Tally Prime • SAP FICO • AP/AR</text>
    <path d="M 30 120 L 230 120" stroke="#334155" stroke-width="1" />
    <text x="130" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• 3-Way Matching for Invoices</text>
    <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Bank &amp; Credit Reconciliations</text>
    <text x="130" y="195" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Payroll &amp; EPF/ESIC Processing</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 305 255 L 345 255" stroke="#34d399" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="345,250 355,255 345,260" fill="#34d399" />

  <!-- Step 2: Statutory Tax & Compliance -->
  <g transform="translate(350, 140)">
    <rect width="260" height="230" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="20" y="15" width="220" height="24" rx="6" fill="#0284c7" fill-opacity="0.3" />
    <text x="130" y="32" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. STATUTORY TAXATION</text>
    <text x="130" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">GST, TDS &amp; Corporate Tax</text>
    <text x="130" y="95" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">GSTR-1/3B/9 • TRACES • ITR-6</text>
    <path d="M 30 120 L 230 120" stroke="#334155" stroke-width="1" />
    <text x="130" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• GSTR-2B Input Tax Credit (ITC)</text>
    <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Section 194C/J/Q TDS Challans</text>
    <text x="130" y="195" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Transfer Pricing &amp; Advance Tax</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 615 255 L 655 255" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="655,250 665,255 655,260" fill="#38bdf8" />

  <!-- Step 3: Reporting, Audit & FP&A -->
  <g transform="translate(660, 140)">
    <rect width="260" height="230" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="20" y="15" width="220" height="24" rx="6" fill="#d97706" fill-opacity="0.3" />
    <text x="130" y="32" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. REPORTING, AUDIT &amp; FP&amp;A</text>
    <text x="130" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Ind AS / IFRS &amp; Forecasts</text>
    <text x="130" y="95" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Schedule III • Variance • DCF</text>
    <path d="M 30 120 L 230 120" stroke="#334155" stroke-width="1" />
    <text x="130" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Statutory P&amp;L and Balance Sheet</text>
    <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Forensic Fraud &amp; Internal Audit</text>
    <text x="130" y="195" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Rolling Forecasts &amp; Unit Economics</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(40, 410)">
    <rect width="880" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="35" fill="#34d399" font-size="12" font-weight="700" font-family="system-ui, sans-serif">STANDARD REGULATORY &amp; SOFTWARE SUITE:</text>
    <text x="30" y="60" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">ICAI Ind AS Standards • GST Portal • Income Tax e-Filing • TallyPrime 4.0 • SAP S/4HANA FICO • Oracle NetSuite • Advanced Power Query</text>
  </g>
</svg>
