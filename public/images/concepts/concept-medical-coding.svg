<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1" />
    <text x="100" y="17" fill="#a5f3fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">HEALTHCARE RCM 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">Medical Coding &amp; Revenue Cycle Management</text>
  </g>

  <!-- Step 1: Clinical Chart Review -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#1d4ed8" fill-opacity="0.3" />
    <text x="120" y="32" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. CLINICAL AUDIT</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">EHR &amp; Doctor Notes</text>
    <text x="120" y="95" fill="#93c5fd" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Epic • Cerner • Operative Reports</text>
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Chief Complaint &amp; Diagnosis</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Surgical &amp; Lab Procedures</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Physician Query for Ambiguity</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 250 L 340 250" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#06b6d4" />

  <!-- Step 2: Code Translation (ICD/CPT) -->
  <g transform="translate(360, 140)">
    <rect width="250" height="220" rx="16" fill="#0c2b33" fill-opacity="0.9" stroke="#06b6d4" stroke-width="2" />
    <rect x="20" y="15" width="210" height="24" rx="6" fill="#0891b2" fill-opacity="0.4" />
    <text x="125" y="32" fill="#a5f3fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. CODE ASSIGNMENT</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">ICD-10-CM &amp; CPT Modifiers</text>
    <text x="125" y="95" fill="#67e8f9" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">AAPC / AHIMA Guidelines</text>
    <path d="M 30 120 L 220 120" stroke="#155e75" stroke-width="1" />
    <text x="125" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• ICD-10 Diagnosis Specificity</text>
    <text x="125" y="165" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• CPT Procedure &amp; E/M Codes</text>
    <text x="125" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• HCPCS Level II &amp; Modifiers (25, 59)</text>
  </g>

  <!-- Arrow -->
  <path d="M 615 250 L 670 250" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="670,245 680,250 670,255" fill="#10b981" />

  <!-- Step 3: Claim Scrubbing & Reimbursement -->
  <g transform="translate(680, 140)">
    <rect width="240" height="220" rx="16" fill="#06281e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. CLAIM SUBMISSION</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">CMS-1500 &amp; UB-04</text>
    <text x="120" y="95" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">First-Pass Acceptance Rate >98%</text>
    <path d="M 30 120 L 210 120" stroke="#065f46" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• NCCI Edit Validation &amp; Scrubbing</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Clearinghouse Electronic Transmission</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Denial Prevention &amp; Appeals</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">MEDICAL CODING STANDARDS &amp; CREDENTIALS</text>
    <text x="440" y="60" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">AAPC CPC (Certified Professional Coder) • AHIMA CCS • ICD-10-CM • CPT-4 • HCPCS • 3M Codefinder • HIPAA Compliance</text>
  </g>
</svg>
