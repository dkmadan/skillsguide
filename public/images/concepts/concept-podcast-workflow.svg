<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1" />
    <text x="110" y="17" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">AUDIO &amp; VIDEO BROADCAST</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">Podcast Production, Audio Mastering &amp; Syndication</text>
  </g>

  <!-- Step 1: Multitrack Recording & Acoustics -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#4338ca" fill-opacity="0.3" />
    <text x="120" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. MULTITRACK CAPTURE</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Riverside.fm &amp; Shure SM7B</text>
    <text x="120" y="95" fill="#c7d2fe" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">4K Local ISO Video &amp; 48kHz WAV</text>
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Studio Acoustics &amp; Mic Technique</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dual-Host &amp; Remote Guest Setup</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Lossless Backup Audio Track</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 250 L 340 250" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#8b5cf6" />

  <!-- Step 2: Audio Engineering & Descript Text Edit -->
  <g transform="translate(360, 140)">
    <rect width="250" height="220" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="2" />
    <rect x="20" y="15" width="210" height="24" rx="6" fill="#4338ca" fill-opacity="0.4" />
    <text x="125" y="32" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. EDITING &amp; MASTERING</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Descript &amp; iZotope RX</text>
    <text x="125" y="95" fill="#c7d2fe" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">-16 LUFS Loudness &amp; De-Essing</text>
    <path d="M 30 120 L 220 120" stroke="#3730a3" stroke-width="1" />
    <text x="125" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Text-Based Filler Word Removal</text>
    <text x="125" y="165" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dynamic EQ, Compression &amp; Limiting</text>
    <text x="125" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Multicam Auto-Switching in Premiere</text>
  </g>

  <!-- Arrow -->
  <path d="M 615 250 L 670 250" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="670,245 680,250 670,255" fill="#10b981" />

  <!-- Step 3: RSS Syndication, YouTube & Viral Shorts -->
  <g transform="translate(680, 140)">
    <rect width="240" height="220" rx="16" fill="#06281e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. SYNDICATION &amp; CLIPS</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Spotify, Apple &amp; Shorts</text>
    <text x="120" y="95" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">ID3 Chapter Tags &amp; Dynamic Ads</text>
    <path d="M 30 120 L 210 120" stroke="#065f46" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Megaphone / Transistor RSS Feed</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• 5 Vertical TikTok/Reels Cutdowns</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• SEO Show Notes &amp; Timestamps</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">PODCAST PRODUCTION TOOLS</text>
    <text x="440" y="60" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Descript • Adobe Audition • Logic Pro • Riverside.fm • iZotope RX • Megaphone • Opus Clip • Spotify Video</text>
  </g>
</svg>
