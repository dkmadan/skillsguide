<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#ef4444" fill-opacity="0.2" stroke="#f87171" stroke-width="1" />
    <text x="100" y="17" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CREATOR ECONOMY 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">YouTube Operations, Packaging &amp; Retention Engine</text>
  </g>

  <!-- Step 1: Ideation & Packaging (CTR) -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#b91c1c" fill-opacity="0.3" />
    <text x="120" y="32" fill="#fca5a5" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. PACKAGING &amp; CTR</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Title &amp; Thumbnail Testing</text>
    <text x="120" y="95" fill="#fca5a5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Target CTR > 8.5%</text>
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• 3 Thumbnail A/B Variants</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Curiosity Gap &amp; Visual Anchors</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• 100 Outlier Video Benchmarking</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 250 L 340 250" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#ef4444" />

  <!-- Step 2: Hook Engineering & Retention Curves (AVD) -->
  <g transform="translate(360, 140)">
    <rect width="250" height="220" rx="16" fill="#2a0a0a" fill-opacity="0.9" stroke="#ef4444" stroke-width="2" />
    <rect x="20" y="15" width="210" height="24" rx="6" fill="#991b1b" fill-opacity="0.4" />
    <text x="125" y="32" fill="#fecaca" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. RETENTION ENGINEERING</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">First 30s Hook &amp; Pacing</text>
    <text x="125" y="95" fill="#f87171" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Target Retention > 50% at 50% Mark</text>
    <path d="M 30 120 L 220 120" stroke="#7f1d1d" stroke-width="1" />
    <text x="125" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Payoff First 5-Second Promise</text>
    <text x="125" y="165" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dynamic J-Cuts &amp; Sound Design</text>
    <text x="125" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Pattern Interrupts Every 45s</text>
  </g>

  <!-- Arrow -->
  <path d="M 615 250 L 670 250" stroke="#10b981" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="670,245 680,250 670,255" fill="#10b981" />

  <!-- Step 3: Browse Algorithm, End Screens & Sponsorships -->
  <g transform="translate(680, 140)">
    <rect width="240" height="220" rx="16" fill="#06281e" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#059669" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a7f3d0" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. ALGORITHM &amp; MONETIZATION</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Browse Features &amp; RPM</text>
    <text x="120" y="95" fill="#6ee7b7" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">End-Screen Binging &amp; Brand Deals</text>
    <path d="M 30 120 L 210 120" stroke="#065f46" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• YouTube Studio Analytics Cohorts</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Dedicated Brand Integration Deck</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Digital Product Back-End Funnel</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">YOUTUBE OPERATIONS TOOLING</text>
    <text x="440" y="60" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">YouTube Studio • 1of10 • Thumbnail Test • VidIQ • Notion Content Kanban • Frame.io • Premiere Pro</text>
  </g>
</svg>
