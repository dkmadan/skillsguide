<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="spatialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#141126" />
    </linearGradient>
    <linearGradient id="blenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="ue5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#spatialBg)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#a855f7" fill-opacity="0.18" stroke="#c084fc" stroke-width="1" />
    <text x="90" y="17" fill="#e9d5ff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3D &amp; SPATIAL COMPUTING</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">Blender 3D Asset Pipeline, Unreal Engine 5 &amp; visionOS Spatial UI</text>
  </g>

  <!-- 3 Stage Production Pipeline -->
  <!-- Stage 1: Blender Asset Pipeline -->
  <g transform="translate(40, 130)">
    <rect width="260" height="340" rx="16" fill="#1c0e07" fill-opacity="0.5" stroke="#f97316" stroke-width="1.5" />
    <rect x="15" y="15" width="230" height="28" rx="8" fill="url(#blenderGrad)" />
    <text x="130" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1. BLENDER 3D MODELING</text>

    <g transform="translate(15, 60)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#7c2d12" />
      <text x="15" y="22" fill="#fdba74" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Hard Surface &amp; Topology</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Subdivision surface, quad remeshing</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#7c2d12" />
      <text x="15" y="22" fill="#fdba74" font-size="11" font-weight="700" font-family="system-ui, sans-serif">UV Unwrapping &amp; Seams</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Non-overlapping UV islands &amp; texel density</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#7c2d12" />
      <text x="15" y="22" fill="#fdba74" font-size="11" font-weight="700" font-family="system-ui, sans-serif">PBR Texture Baking</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Albedo, Roughness, Metallic, Normal, AO</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="230" height="65" rx="10" fill="#2d1108" stroke="#ea580c" stroke-dasharray="3 3" />
      <text x="115" y="26" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">USDZ &amp; FBX Export</text>
      <text x="115" y="46" fill="#fdba74" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Optimized LODs &amp; Rigged Skeletal Meshes</text>
    </g>
  </g>

  <!-- Arrow Stage 1 -> Stage 2 -->
  <path d="M 305 300 L 345 300" stroke="#f97316" stroke-width="2.5" />
  <polygon points="345,295 355,300 345,305" fill="#f97316" />

  <!-- Stage 2: Unreal Engine 5 -->
  <g transform="translate(360, 130)">
    <rect width="260" height="340" rx="16" fill="#0a1836" fill-opacity="0.5" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="15" width="230" height="28" rx="8" fill="url(#ue5Grad)" />
    <text x="130" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2. UNREAL ENGINE 5 REAL-TIME</text>

    <g transform="translate(15, 60)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#1d4ed8" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Nanite Virtualized Geometry</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Billions of film-quality polygon assets at 60fps</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#1d4ed8" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Lumen Global Illumination</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Real-time infinite diffuse bounces &amp; shadows</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="230" height="50" rx="10" fill="#0f172a" stroke="#1d4ed8" />
      <text x="15" y="22" fill="#93c5fd" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Blueprint Visual Scripting</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Interactive architectural walkthroughs &amp; physics</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="230" height="65" rx="10" fill="#172554" stroke="#2563eb" stroke-dasharray="3 3" />
      <text x="115" y="26" fill="#bfdbfe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">ArchViz &amp; Virtual Production</text>
      <text x="115" y="46" fill="#93c5fd" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Photorealistic photogrammetry &amp; LED stages</text>
    </g>
  </g>

  <!-- Arrow Stage 2 -> Stage 3 -->
  <path d="M 625 300 L 665 300" stroke="#a855f7" stroke-width="2.5" />
  <polygon points="665,295 675,300 665,305" fill="#a855f7" />

  <!-- Stage 3: Apple Vision Pro & Spatial UI -->
  <g transform="translate(680, 130)">
    <rect width="240" height="340" rx="16" fill="#1e1338" fill-opacity="0.5" stroke="#a855f7" stroke-width="2" />
    <rect x="15" y="15" width="210" height="28" rx="8" fill="url(#visionGrad)" />
    <text x="120" y="34" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3. APPLE VISION PRO (visionOS)</text>

    <g transform="translate(15, 60)">
      <rect width="210" height="50" rx="10" fill="#0f172a" stroke="#7e22ce" />
      <text x="15" y="22" fill="#d8b4fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Spatial Windows &amp; Volumes</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">SwiftUI 3D windows in passthrough space</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="210" height="50" rx="10" fill="#0f172a" stroke="#7e22ce" />
      <text x="15" y="22" fill="#d8b4fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">RealityKit &amp; Reality Composer</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Entity Component System (ECS) anchor points</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="210" height="50" rx="10" fill="#0f172a" stroke="#7e22ce" />
      <text x="15" y="22" fill="#d8b4fe" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Eye &amp; Hand Tracking Gestures</text>
      <text x="15" y="38" fill="#cbd5e1" font-size="9.5" font-family="system-ui, sans-serif">Hover highlights &amp; pinch manipulation</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="210" height="65" rx="10" fill="#3b0764" stroke="#9333ea" stroke-dasharray="3 3" />
      <text x="105" y="26" fill="#f5d0fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Fully Immersive Spaces</text>
      <text x="105" y="46" fill="#e9d5ff" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Next-Gen Spatial Computing Interfaces</text>
    </g>
  </g>
</svg>
