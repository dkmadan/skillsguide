<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="200" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1" />
    <text x="100" y="17" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">AUTONOMOUS SYSTEMS 2026</text>
    <text x="0" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="system-ui, sans-serif">AI Agents &amp; LLM Application Architecture</text>
  </g>

  <!-- Step 1: User Goal & Orchestration -->
  <g transform="translate(40, 140)">
    <rect width="240" height="220" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#1d4ed8" fill-opacity="0.3" />
    <text x="120" y="32" fill="#93c5fd" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">1. PLANNING &amp; REASONING</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">ReAct / Multi-Agent Loop</text>
    <text x="120" y="95" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">LangGraph • CrewAI • AutoGen</text>
    
    <path d="M 30 120 L 210 120" stroke="#334155" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Goal Decomposition</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• State Graph Persistence</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Reflection &amp; Self-Correction</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 285 250 L 340 250" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="340,245 350,250 340,255" fill="#8b5cf6" />

  <!-- Step 2: Model Context Protocol (MCP) & Context -->
  <g transform="translate(360, 140)">
    <rect width="250" height="220" rx="16" fill="#1e1b4b" fill-opacity="0.9" stroke="#818cf8" stroke-width="2" />
    <rect x="20" y="15" width="210" height="24" rx="6" fill="#4338ca" fill-opacity="0.4" />
    <text x="125" y="32" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2. MODEL CONTEXT PROTOCOL</text>
    <text x="125" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Standardized MCP Server</text>
    <text x="125" y="95" fill="#a5b4fc" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">JSON-RPC 2.0 • Dynamic Discovery</text>
    
    <path d="M 30 120 L 220 120" stroke="#3730a3" stroke-width="1" />
    <text x="125" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Database Schemas &amp; Vectors</text>
    <text x="125" y="165" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Local Filesystem &amp; Git Code</text>
    <text x="125" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Secure Enterprise REST APIs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 615 250 L 670 250" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="670,245 680,250 670,255" fill="#06b6d4" />

  <!-- Step 3: Execution, Guardrails & LLM Inference -->
  <g transform="translate(680, 140)">
    <rect width="240" height="220" rx="16" fill="#0f2937" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="20" y="15" width="200" height="24" rx="6" fill="#0891b2" fill-opacity="0.3" />
    <text x="120" y="32" fill="#a5f3fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3. INFERENCE &amp; GUARDRAILS</text>
    <text x="120" y="70" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">vLLM &amp; LangSmith</text>
    <text x="120" y="95" fill="#67e8f9" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">LoRA Fine-Tuning • Guardrails</text>
    
    <path d="M 30 120 L 210 120" stroke="#155e75" stroke-width="1" />
    <text x="120" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• PII Masking &amp; Hallucination Checks</text>
    <text x="120" y="165" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Async Sandbox Tool Runner</text>
    <text x="120" y="185" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">• Deterministic JSON Output</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(40, 400)">
    <rect width="880" height="85" rx="12" fill="#13192b" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="30" fill="#94a3b8" font-size="11.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">CORE 2026 STACK &amp; PROTOCOLS</text>
    <text x="440" y="60" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">LangGraph • Anthropic MCP • Claude 3.5 Sonnet • QLoRA • Pydantic • Pinecone • Phoenix Telemetry</text>
  </g>
</svg>
