<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="solarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140c" />
      <stop offset="100%" stop-color="#141a0b" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#solarBg)" stroke="#1e3a1f" stroke-width="2" />
  
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#22c55e" fill-opacity="0.18" stroke="#4ade80" stroke-width="1" />
    <text x="90" y="17" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">RENEWABLE INFRASTRUCTURE</text>
    <text x="0" y="55" fill="#f8fafc" font-size="20" font-weight="800" font-family="system-ui, sans-serif">PVsyst Solar Farm Yield Modeling, Grid Interconnection &amp; ESG Auditing</text>
  </g>

  <!-- 4-Stage Utility Solar Lifecycle -->
  <!-- Stage 1: PVsyst Simulation & Irradiance -->
  <g transform="translate(40, 130)">
    <rect width="210" height="340" rx="16" fill="#142615" fill-opacity="0.5" stroke="#22c55e" stroke-width="2" />
    <rect x="15" y="15" width="180" height="28" rx="8" fill="url(#yellowGrad)" />
    <text x="105" y="34" fill="#0f172a" font-size="11.5" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">1. PVSYST 3D MODELING</text>

    <g transform="translate(15, 60)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#166534" />
      <text x="12" y="22" fill="#fef08a" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Meteo &amp; GHI Irradiance</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">NASA / Meteonorm Global Datasets</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#166534" />
      <text x="12" y="22" fill="#fef08a" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">3D Near-Shading Loss</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Terrain, topography &amp; tracker tilt</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#166534" />
      <text x="12" y="22" fill="#fef08a" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Bifacial PV Gain</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Albedo ground reflection (+12% yield)</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="180" height="65" rx="10" fill="#143518" stroke="#22c55e" stroke-dasharray="3 3" />
      <text x="90" y="26" fill="#bbf7d0" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">P50 / P90 Generation Report</text>
      <text x="90" y="46" fill="#86efac" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Bankable Financial DPR Projections</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 255 300 L 285 300" stroke="#22c55e" stroke-width="2.5" />
  <polygon points="285,295 295,300 285,305" fill="#22c55e" />

  <!-- Stage 2: Inverters & Balance of Plant (BOP) -->
  <g transform="translate(300, 130)">
    <rect width="210" height="340" rx="16" fill="#0f2b18" fill-opacity="0.5" stroke="#16a34a" stroke-width="2" />
    <rect x="15" y="15" width="180" height="28" rx="8" fill="url(#greenGrad)" />
    <text x="105" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2. INVERTER &amp; DC/AC</text>

    <g transform="translate(15, 60)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#15803d" />
      <text x="12" y="22" fill="#86efac" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Central vs String Sizing</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">1500V DC String Combiner Boxes</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#15803d" />
      <text x="12" y="22" fill="#86efac" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">MPPT Tracking Algorithms</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">Maximizing IV-curve peak power</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="180" height="50" rx="10" fill="#0f172a" stroke="#15803d" />
      <text x="12" y="22" fill="#86efac" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Cable Loss &amp; Clipping</text>
      <text x="12" y="38" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif">DC/AC ILR ratio optimization (1.3x)</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="180" height="65" rx="10" fill="#052e16" stroke="#16a34a" stroke-dasharray="3 3" />
      <text x="90" y="26" fill="#dcfce7" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Step-Up Transformers</text>
      <text x="90" y="46" fill="#86efac" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Stepping from 800V AC to 33kV Pool</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 515 300 L 545 300" stroke="#16a34a" stroke-width="2.5" />
  <polygon points="545,295 555,300 545,305" fill="#16a34a" />

  <!-- Stage 3: Grid Interconnection -->
  <g transform="translate(560, 130)">
    <rect width="180" height="340" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="15" width="150" height="28" rx="8" fill="#0284c7" />
    <text x="90" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">3. GRID SUBSTATION</text>

    <g transform="translate(15, 60)">
      <rect width="150" height="50" rx="10" fill="#1e293b" stroke="#0369a1" />
      <text x="10" y="22" fill="#7dd3fc" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">132kV / 220kV Bay</text>
      <text x="10" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">State Transmission Utility</text>
    </g>

    <g transform="translate(15, 125)">
      <rect width="150" height="50" rx="10" fill="#1e293b" stroke="#0369a1" />
      <text x="10" y="22" fill="#7dd3fc" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">Grid Code &amp; Harmonics</text>
      <text x="10" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">CEA Indian Standards</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="150" height="50" rx="10" fill="#1e293b" stroke="#0369a1" />
      <text x="10" y="22" fill="#7dd3fc" font-size="10.5" font-weight="700" font-family="system-ui, sans-serif">SCADA &amp; ABT Meters</text>
      <text x="10" y="38" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif">Real-time telemetry to SLDC</text>
    </g>

    <g transform="translate(15, 255)">
      <rect width="150" height="65" rx="10" fill="#082f49" stroke="#0284c7" stroke-dasharray="3 3" />
      <text x="75" y="26" fill="#bae6fd" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">BESS Battery Storage</text>
      <text x="75" y="46" fill="#7dd3fc" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Frequency regulation &amp; peak shift</text>
    </g>
  </g>

  <!-- Arrow Stage 3 -> Stage 4 -->
  <path d="M 745 300 L 765 300" stroke="#10b981" stroke-width="2.5" />
  <polygon points="765,295 775,300 765,305" fill="#10b981" />

  <!-- Stage 4: ESG Compliance Auditing -->
  <g transform="translate(780, 130)">
    <rect width="140" height="340" rx="16" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.5" />
    <rect x="10" y="15" width="120" height="28" rx="8" fill="#059669" />
    <text x="70" y="34" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4. ESG AUDIT</text>

    <g transform="translate(10, 60)">
      <rect width="120" height="50" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="8" y="22" fill="#a7f3d0" font-size="10" font-weight="700" font-family="system-ui, sans-serif">SEBI BRSR Core</text>
      <text x="8" y="38" fill="#94a3b8" font-size="8.5" font-family="system-ui, sans-serif">Mandatory Top 1000</text>
    </g>

    <g transform="translate(10, 125)">
      <rect width="120" height="50" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="8" y="22" fill="#a7f3d0" font-size="10" font-weight="700" font-family="system-ui, sans-serif">Scope 1, 2, 3 GHG</text>
      <text x="8" y="38" fill="#94a3b8" font-size="8.5" font-family="system-ui, sans-serif">Carbon Offsetting</text>
    </g>

    <g transform="translate(10, 190)">
      <rect width="120" height="50" rx="10" fill="#0f172a" stroke="#047857" />
      <text x="8" y="22" fill="#a7f3d0" font-size="10" font-weight="700" font-family="system-ui, sans-serif">I-REC Certificates</text>
      <text x="8" y="38" fill="#94a3b8" font-size="8.5" font-family="system-ui, sans-serif">Renewable Trading</text>
    </g>

    <g transform="translate(10, 255)">
      <rect width="120" height="65" rx="10" fill="#022c22" stroke="#059669" stroke-dasharray="3 3" />
      <text x="60" y="26" fill="#d1fae5" font-size="10" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Net Zero 2070</text>
      <text x="60" y="46" fill="#a7f3d0" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">Decarbonization</text>
    </g>
  </g>
</svg>
